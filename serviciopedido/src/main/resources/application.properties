spring.application.name=serviciopedido
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/pedidos_db
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672

# CIRCUIT BREAKER PEDIDOS

resilience4j.circuitbreaker.instances.envioService.register-health-indicator=true
resilience4j.circuitbreaker.instances.envioService.sliding-window-size=5
resilience4j.circuitbreaker.instances.envioService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.envioService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.envioService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.envioService.permitted-number-of-calls-in-half-open-state=2